<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
:root {
    --bg: __BG__;
    --fg: __FG__;
    --muted: __MUTED__;
    --border: __BORDER__;
    --accent: __ACCENT__;
    --code-bg: __CODE_BG__;
    --pre-bg: __PRE_BG__;
    --table-hdr: __TABLE_HDR__;
    --table-alt: __TABLE_ALT__;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    padding: 40px 24px;
}

/* ── Toolbar ── */
#toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 999;
}

#toolbar .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 40%;
}

#toolbar .actions {
    display: flex;
    align-items: center;
    gap: 4px;
}

#toolbar .actions button {
    font-size: 12px;
    font-family: inherit;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
}

#toolbar .actions button:hover {
    background: var(--border);
    color: var(--fg);
}

#toolbar .theme-badge {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-right: 2px;
}

/* ── Content wrapper ── */
#wrap {
    max-width: 800px;
    margin: 0 auto;
    padding-top: 60px;
}

/* ── Headings ── */
h1 { font-size: 28px; margin: 0 0 16px; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
h2 { font-size: 22px; margin: 28px 0 12px; font-weight: 600; }
h3 { font-size: 18px; margin: 24px 0 8px; font-weight: 600; }
h4 { font-size: 16px; margin: 20px 0 8px; font-weight: 600; }
h5, h6 { font-size: 14px; margin: 16px 0 8px; font-weight: 600; color: var(--muted); }
p { margin: 0 0 14px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
strong { font-weight: 600; }
em { font-style: italic; }

/* ── Lists ── */
ul, ol { padding-left: 24px; margin: 0 0 14px; }
li { margin: 4px 0; }
li > p { margin-top: 6px; }
input[type=checkbox] { margin-right: 6px; transform: scale(1.05); }
ul:has(input[type=checkbox]) { list-style: none; padding-left: 0; }

/* ── Blockquote ── */
blockquote { margin: 0 0 14px; padding: 4px 16px; color: var(--muted); border-left: 4px solid var(--border); }

/* ── Code ── */
code { padding: 2px 6px; font-size: .88em; font-family: "SF Mono", Consolas, "Cascadia Code", monospace; background: var(--code-bg); border-radius: 4px; }
pre { padding: 14px 16px; overflow-x: auto; font-size: .88em; line-height: 1.5; background: var(--pre-bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px; }
pre code { padding: 0; font-size: 100%; background: transparent; border: 0; }

/* ── Table ── */
table { border-collapse: collapse; width: 100%; margin-bottom: 14px; font-size: .95em; }
th, td { padding: 7px 12px; border: 1px solid var(--border); text-align: left; }
th { font-weight: 600; background: var(--table-hdr); }
tr:nth-child(even) { background: var(--table-alt); }

/* ── Misc ── */
hr { height: 1px; border: 0; background: var(--border); margin: 24px 0; }
img { max-width: 100%; border-radius: 4px; margin: 8px 0; }

/* ── Status in toolbar ── */
#toolbar .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2da44e; display: inline-block;
    margin-right: 4px;
}

/* ── Print styles ── */
@media print {
    #toolbar, #status { display: none !important; }
    body { padding: 0 !important; }
    #wrap { padding-top: 0 !important; max-width: 100% !important; }
    pre { break-inside: avoid; }
    table { break-inside: avoid; }
    h1, h2, h3, h4 { break-after: avoid; }
}
</style>
</head>
<body>

<div id="toolbar">
    <span style="display:flex;align-items:center;gap:6px;">
        <span class="dot"></span>
        <span class="name" id="fileName">__FILENAME__</span>
    </span>
    <div class="actions">
        <span style="font-size:10px;color:var(--muted);margin-right:4px;">
            <a href="https://yujian2025.blog.csdn.net" target="_blank" style="color:inherit;text-decoration:none;" title="博客">blog</a>
            <span style="color:var(--border);margin:0 3px;">|</span>
            <a href="https://github.com/yujian2025" target="_blank" style="color:inherit;text-decoration:none;" title="GitHub">git</a>
        </span>
        <button id="btnBack" data-zh="← 打开文件" data-en="← Open File">← 打开文件</button>
        <button id="btnPrint" data-zh="🖨️ 打印" data-en="🖨️ Print">🖨️ 打印</button>
        <button id="btnClose" data-zh="✕" data-en="✕">✕</button>
    </div>
</div>

<div id="wrap"><div id="content">__CONTENT__</div></div>
<div id="status" data-zh-watching="● watching" data-en-watching="● watching" data-zh-reload="⟳ reloading..." data-en-reload="⟳ reloading..." data-zh-offline="⚠ offline" data-en-offline="⚠ offline"><span class="dot"></span></div>

<script>
(function() {
    var v = 0;
    var fileId = '__FILE_ID__';

    // ── 语言切换 ──
    var lang = localStorage.getItem('mdpreview_lang') || 'zh';

    function applyLang(l) {
        lang = l;
        localStorage.setItem('mdpreview_lang', l);
        document.querySelectorAll('[data-zh]').forEach(function(el) {
            el.textContent = el.getAttribute('data-' + l) || el.textContent;
        });
        // Update status text
        var st = document.getElementById('status');
        if (!st.classList.contains('loading')) {
            st.textContent = st.getAttribute('data-' + l + '-watching') || st.textContent;
        }
        // Update html lang
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
    }

    // Apply initial language
    applyLang(lang);

    // Toggle language on button click (toggle each time)
    function toggleLang() {
        applyLang(lang === 'zh' ? 'en' : 'zh');
    }

    // ── 打开文件（返回文件列表，不关闭当前文件）──
    document.getElementById('btnBack').onclick = function() {
        window.location.href = '/files';
    };

    // ── 打印 / PDF ──
    document.getElementById('btnPrint').onclick = function() {
        window.print();
    };

    // ── 关闭文档，返回首页 ──
    document.getElementById('btnClose').onclick = function() {
        var s = document.getElementById('status');
        s.textContent = s.getAttribute('data-' + lang + '-reload') || '⟳ reloading...';
        s.className = 'loading';
        fetch('/close?id=' + encodeURIComponent(fileId), {method:'POST'})
            .then(function(){ window.location.href = '/'; })
            .catch(function(){ window.location.href = '/'; });
    };

    // ── 实时刷新 ──
    function reload() {
        var s = document.getElementById('status');
        s.textContent = s.getAttribute('data-' + lang + '-reload') || '⟳ reloading...';
        s.className = 'loading';
        fetch('/content?id=' + encodeURIComponent(fileId))
            .then(function(r){ return r.text(); })
            .then(function(h){
                document.getElementById('content').innerHTML = h;
                s.textContent = s.getAttribute('data-' + lang + '-watching') || '● watching';
                s.className = '';
            })
            .catch(function(){
                s.textContent = s.getAttribute('data-' + lang + '-offline') || '⚠ offline';
                s.className = 'loading';
            });
    }

    function check() {
        fetch('/check?id=' + encodeURIComponent(fileId) + '&t='+Date.now())
            .then(function(r){ return r.text(); })
            .then(function(n){
                var x = parseInt(n,10);
                if (v===0) { v=x; }
                else if (x!==v) { v=x; reload(); }
            })
            .catch(function(){});
    }

    // Initial version fetch
    fetch('/check?id=' + encodeURIComponent(fileId) + '&t='+Date.now())
        .then(function(r){ return r.text(); })
        .then(function(n){ v=parseInt(n,10); })
        .catch(function(){});

    setInterval(check, 1500);

    // ── 中英文双击切换 ──
    document.getElementById('btnBack').addEventListener('dblclick', toggleLang);
})();
</script>
</body>
</html>
